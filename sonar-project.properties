# SonarCloud configuration for the GCP Portfolio Service.
#
# Picked up automatically by SonarCloud Automatic Analysis (no GitHub
# Action wiring needed). To verify locally with `sonar-scanner`, run from
# the repo root.

sonar.projectKey=abhinavformula1_GCP-PORTFOLIO-SERVICE
sonar.organization=abhinavformula1

# Sources / tests
sonar.sources=public,src,server.js
sonar.tests=
sonar.sourceEncoding=UTF-8

# ── Copy-paste detection (CPD) exclusions ─────────────────────────────────
#
# Files listed here are scanned for everything EXCEPT the duplication
# metric. Use this for files that are inherently parallel by structure —
# flagging them as duplicates produces noise that drowns out real findings.
#
#   public/assets/core/i18n.js
#     Translation dictionaries by definition mirror their structure across
#     locales (every key in `en` has a near-identical `fr` counterpart).
#     Sonar's CPD treats this as 100% duplicated code; the only way to
#     "fix" it without losing translations would be to factor every
#     locale into a separate file with shared schema — net loss in
#     readability for the same metric outcome.
#
#   public/assets/ui/systemdesign.js
#     Documentation/article content is stored as repeated HTML section
#     strings by design. CPD sees the repeated cards/list/table structure
#     as duplication, but extracting every paragraph into abstractions
#     would make the authored documentation harder to read and maintain.
#
#   public/assets/chat/widgets.js
#     Tiny shared DOM-builder. The SVG path string for the send icon
#     necessarily appears in both the helper and any test/snapshot
#     output, but the helper itself isn't really "duplicate" code.
#
sonar.cpd.exclusions=public/assets/core/i18n.js,public/assets/ui/systemdesign.js,public/assets/chat/widgets.js

# ── General analysis exclusions ─────────────────────────────────────────
# Things we don't want analysed at all (vendored / generated / tooling).
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.tools/**,**/coverage/**,public/assets/lib/**

